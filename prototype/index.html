<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>朝夕记行 · 首页</title>
  <link rel="stylesheet" href="assets/base.css" />
  <link rel="stylesheet" href="assets/pages.css" />
</head>
<body>
  <div class="app">
    <div class="statusbar">
      <span>9:41</span>
      <span class="statusbar-icons">●●● ▮▮</span>
    </div>
    <div class="proto-badge">原型 · 假数据</div>

    <main class="screen home">
      <div class="glow"></div>

      <div class="hero">
        <div class="hero-mark">朝夕记行</div>
        <div class="hero-slogan">有计划，总比没有计划强</div>
        <div class="hero-date" id="todayDate">11月12日 周四</div>
      </div>

      <a class="entry entry--adult" href="select.html?mode=adult">
        <div class="entry-head">
          <span class="entry-emoji">🌅</span>
          <span class="entry-title">我的小闯关</span>
        </div>
        <p class="entry-desc">给今天的自己，安排几件想做好的事</p>
        <div class="entry-foot">
          <span class="entry-stat">今天 2/5</span>
          <span class="entry-go">开始 ›</span>
        </div>
      </a>

      <a class="entry entry--kid" href="select.html?mode=kid">
        <div class="entry-head">
          <span class="entry-emoji">🧸</span>
          <span class="entry-title">宝贝打卡站</span>
        </div>
        <p class="entry-desc">每完成一件事，就点亮一颗小星星</p>
        <div class="entry-foot">
          <span class="entry-stat">今天 1/4</span>
          <span class="entry-go">开始 ›</span>
        </div>
      </a>

      <div class="home-actions">
        <a class="pill" href="history.html">我的过去</a>
      </div>

      <div class="home-foot">每天记录一点点</div>
    </main>
  </div>
  <script src="assets/shared.js"></script>
</body>
</html>
